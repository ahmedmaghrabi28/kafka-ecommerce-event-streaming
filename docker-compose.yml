# Kafka lab - single-node KRaft (broker + controller), no ZooKeeper.
services:
  kafka:
    image: apache/kafka:4.0.1
    container_name: gaming-kafka
    hostname: kafka

    ports:
      # Bound to loopback only so the plaintext broker is not exposed on the LAN.
      - "127.0.0.1:9092:9092"

    environment:
      # --- KRaft identity ---
      CLUSTER_ID: "gaming-kafka-lab-0001"   # any stable string; keeps storage format consistent across restarts
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Listeners ---
      # EXTERNAL -> clients on the host (localhost:9092)
      # INTERNAL -> other containers on the compose network (kafka:29092)
      # CONTROLLER -> KRaft quorum traffic only (never published)
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Storage: must point at the mounted volume, otherwise data goes to /tmp ---
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # --- Single-node replication settings ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # --- Topic defaults ---
      # Any producer/consumer that touches an unknown topic gets it created
      # automatically with these defaults (3 partitions, RF 1).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Scripts may also create/delete topics explicitly via the Admin API.
      KAFKA_DELETE_TOPIC_ENABLE: "true"

      # --- JVM sizing (heap ~half of the container limit; rest for page cache/off-heap) ---
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    mem_limit: 1g
    cpus: 1.0

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

volumes:
  kafka_data: